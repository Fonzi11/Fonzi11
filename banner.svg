<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Ismael Fonseca - Mechatronics and Bioengineering" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.f{font-family:'Courier New',Courier,monospace;font-weight:700}
@keyframes g1{0%,90%,100%{transform:translate(0,0)}92%{transform:translate(-7px,1px)}94%{transform:translate(5px,-1px)}96%{transform:translate(-3px,0)}}
@keyframes g2{0%,90%,100%{transform:translate(0,0)}92%{transform:translate(7px,-1px)}94%{transform:translate(-5px,1px)}96%{transform:translate(3px,0)}}
@keyframes grid{from{transform:translateY(0)}to{transform:translateY(40px)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes flick{0%,93%,100%{opacity:1}94%{opacity:.35}96%{opacity:1}97%{opacity:.5}}
.c{animation:g1 6s steps(1,end) infinite}.m{animation:g2 6s steps(1,end) infinite}
.gr{animation:grid 2s linear infinite}.bl{animation:blink 1s steps(1,end) infinite}.fl{animation:flick 7s steps(1,end) infinite}
@media (prefers-reduced-motion:reduce){.c,.m,.gr,.bl,.fl{animation:none}}
</style>
